# Zap Komunick: brings the Ticketz updates into a pull request to dev, every day and on demand.
# How it works and how to merge: docs/ATUALIZACOES-DO-TICKETZ.md
name: Sincronizar com o Ticketz

on:
  schedule:
    - cron: "17 9 * * *" # every day at 06:17 in Brasília
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sincronizar-ticketz
  cancel-in-progress: false

jobs:
  sincronizar:
    if: github.repository == 'Komunick/zap-komunick'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SINCRONIZAR_TICKETZ_TOKEN || github.token }}

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync with Ticketz
        env:
          GH_TOKEN: ${{ secrets.SINCRONIZAR_TICKETZ_TOKEN || github.token }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/sincronizar-ticketz.sh
