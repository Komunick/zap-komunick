name: Validate code and optionally publish own images

on:
  pull_request:
  push:
    branches: [main, dev, "fix/**", "test-**"]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      publish_images:
        description: "Publish the checked commit to this repository's GHCR namespace"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

env:
  NODE_VERSION: "24.22.1"

jobs:
  backend_checks:
    name: Backend tests, types and CI policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install locked dependencies without lifecycle scripts
        working-directory: backend
        run: npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Check workflow policy
        run: node --test .github/scripts/image-policy.test.cjs
      - name: Generate translation keys and compile TypeScript
        working-directory: backend
        run: |
          node node_modules/ts-node/dist/bin.js src/scripts/extractTranslationKeys.ts
          node node_modules/typescript/bin/tsc --sourceMap false
      - name: Run backend tests directly without pretest or posttest
        working-directory: backend
        env:
          NODE_ENV: test
          CI: "true"
        run: node node_modules/jest/bin/jest.js --runInBand --coverage=false

  frontend_checks:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Select the tested frontend npm version
        # Keep lockfile materialization aligned with the clean native test gate.
        run: |
          npm install --global npm@10.9.4 --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = "10.9.4"
      - name: Install locked dependencies without lifecycle scripts
        working-directory: frontend
        # The browser does not use the optional native canvas addon. Without
        # install scripts its missing binary would break jsdom before any test.
        run: npm ci --ignore-scripts --legacy-peer-deps --omit=optional --no-audit --no-fund
      - name: Run frontend tests
        working-directory: frontend
        env:
          CI: "true"
          NODE_OPTIONS: --openssl-legacy-provider
        run: node node_modules/react-scripts/bin/react-scripts.js test --watchAll=false --runInBand --coverage=false
      - name: Build frontend with the existing warning policy
        working-directory: frontend
        env:
          # Existing upstream lint warnings remain warnings, as in the previous image build.
          CI: "false"
          GENERATE_SOURCEMAP: "false"
          NODE_OPTIONS: --openssl-legacy-provider
        run: node node_modules/react-scripts/bin/react-scripts.js build

  publish_images:
    name: Explicit publication of the checked commit
    needs: [backend_checks, frontend_checks]
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          inputs.publish_images == true &&
          github.repository == 'Komunick/zap-komunick' &&
          (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Derive image names from this repository
        id: images
        env:
          CI_PUBLISH_IMAGES: ${{ inputs.publish_images }}
        run: node .github/scripts/image-policy.cjs
      - name: Confirm the trusted publication plan
        env:
          CI_PUBLISH_ALLOWED: ${{ steps.images.outputs.publish_allowed }}
        run: test "$CI_PUBLISH_ALLOWED" = true
      - name: Write source metadata without interpreting ref text as code
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const git = args => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const info = {
            commitHash: git(['rev-parse', '--short', 'HEAD']),
            commitTimestamp: git(['log', '-1', '--format=%cI']),
            branchName: process.env.GITHUB_REF_NAME,
            tagName: '',
            buildTimestamp: new Date().toISOString()
          };
          fs.writeFileSync('backend/src/gitinfo.ts', 'export const GitInfo = ' + JSON.stringify(info, null, 2) + ';\n');
          fs.writeFileSync('frontend/public/gitinfo.json', JSON.stringify(info, null, 2) + '\n');
          NODE
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in only for explicit trusted publication
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish backend for the checked source SHA
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.images.outputs.backend_image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Publish frontend for the checked source SHA
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./frontend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.images.outputs.frontend_image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
