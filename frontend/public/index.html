<!doctype html>
<html translate="no">
  <head>
    <meta charset="utf-8" />
    <title>SuperChat</title>
    <meta name="application-name" content="SuperChat" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Roboto:wght@300;400;500;700&display=swap"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="%PUBLIC_URL%/vector/superchat-icon.svg"
    />
    <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico?v=superchat" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="viewport"
      content="minimum-scale=1, initial-scale=1, width=device-width"
    />

    <style>
      html,
      body {
        height: var(--vh, 100vh);
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      svg.alertsign {
        width: 64px;
        height: 64px;
        margin-bottom: 16px;
      }

      #root {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: var(--vh, 100vh);
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      :root {
        --background: #f0f5f1;
        --splash: #fff;
        --splash-text: #18251e;
        --splash-muted: #4a5d50;
        --splash-edge: #dbe6de;
        --splash-glow: #dbeee0;
        --splash-track: #e3ece5;
        --splash-shadow: rgba(19, 49, 30, 0.09);
        --primary: #1f7f1b;
      }

      :root[data-splash-theme="dark"] {
        --background: #0b120f;
        --splash: #131e18;
        --splash-text: #f5f8f5;
        --splash-muted: #b4c5b9;
        --splash-edge: #2a3b31;
        --splash-glow: #182f21;
        --splash-track: #2b3d32;
        --splash-shadow: rgba(0, 0, 0, 0.24);
        --primary: #35b62e;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      #app-logo-div {
        width: min(100%, 240px);
      }

      #app-logo {
        display: block;
        width: 100%;
        height: auto;
        max-height: 104px;
        object-fit: contain;
      }

      #splash-background {
        position: fixed;
        inset: 0;
        padding: clamp(16px, 4vw, 32px);
        padding-bottom: max(20px, env(safe-area-inset-bottom));
        overflow-y: auto;
        background: radial-gradient(
          ellipse at 50% 36%,
          var(--splash-glow),
          var(--background) 72%
        );
        color: var(--splash-text);
        font-family: Manrope, system-ui, sans-serif;
        z-index: 9998;
        display: grid;
        grid-template-rows: 1fr auto 1fr;
        justify-items: center;
        row-gap: 20px;
      }

      #splash-screen {
        grid-row: 2;
        width: min(100%, 408px);
        padding: clamp(28px, 7vw, 44px) 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
        background: var(--splash);
        border: 1px solid var(--splash-edge);
        border-radius: 24px;
        box-shadow: 0 18px 50px var(--splash-shadow);
      }

      .splash-status {
        margin: 0;
        color: var(--splash-muted);
        font-size: 14px;
        font-weight: 600;
        line-height: 1.4;
      }

      .progress-bar {
        width: min(100%, 164px);
        height: 6px;
        margin: 0 auto;
        overflow: hidden;
        background: var(--splash-track);
        border-radius: 999px;
      }

      .progress {
        width: 0;
        height: 100%;
        background: var(--primary);
        border-radius: inherit;
        transition: width 200ms ease-out;
      }

      #splash-endorsement {
        grid-row: 3;
        align-self: end;
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--splash-muted);
        font-size: 12px;
        line-height: 1.4;
      }

      #splash-endorsement[hidden] {
        display: none;
      }

      #splash-endorsement img {
        display: block;
        width: 84px;
        height: auto;
      }

      .progress.regress {
        width: 100%;
        transition: none;
        animation-name: regress-progress;
        animation-timing-function: linear;
        animation-fill-mode: forwards;
      }

      @media (prefers-reduced-motion: reduce) {
        .progress {
          transition: none;
        }

        .progress.regress {
          animation: none;
        }
      }

      @keyframes regress-progress {
        from {
          width: 100%;
        }

        to {
          width: 0;
        }
      }
    </style>

    <!-- Issue workaround for React v16. -->
    <script>
      // See https://github.com/facebook/react/issues/20829#issuecomment-802088260
      if (!crossOriginIsolated) SharedArrayBuffer = ArrayBuffer;
    </script>
  </head>
  <body>
    <div
      id="pixelAnchor"
      style="
        position: absolute;
        top: 0;
        left: 0;
        width: 1px;
        height: 1px;
        opacity: 0;
      "
    ></div>
    <div id="splash-background">
      <div id="splash-screen">
        <div id="app-logo-div">
          <img
            id="app-logo"
            src="%PUBLIC_URL%/vector/logo.svg"
            width="164"
            height="38"
            alt="SuperChat"
          />
        </div>
        <p class="splash-status" role="status" lang="pt-BR">Carregando…</p>
        <div class="progress-bar" aria-hidden="true">
          <div class="progress" id="progress-bar"></div>
        </div>
      </div>
      <footer id="splash-endorsement">
        <span lang="en">Powered by</span>
        <img
          id="splash-endorsement-logo"
          src="%PUBLIC_URL%/vector/komunick-rodape.svg"
          width="173"
          height="48"
          alt="Komunick Inteligência e Tecnologia"
        />
      </footer>
    </div>
    <div id="root"></div>
    <script>
      window.addEventListener("focusin", () => {
        setTimeout(() => window.scrollTo(0, 0), 0);
      });

      window.visualViewport?.addEventListener("scroll", () => {
        if (window.visualViewport.pageTop) {
          const anchor = document.getElementById("pixelAnchor");
          anchor.scrollIntoView({ block: "start", inline: "nearest" });
        }
      });

      if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
        function handleFocus(e) {
          const root = document.getElementById("root");
          const anchor = document.getElementById("pixelAnchor");
          const el = e.target;
          if (el.tagName === "INPUT" || el.tagName === "TEXTAREA") {
            setTimeout(() => {
              el.scrollIntoView({
                block: "center",
                behavior: "auto"
              });
              setTimeout(() => {
                anchor.scrollIntoView({ block: "start", inline: "nearest" });
              }, 200);
            }, 100);
          }
        }

        root.addEventListener("focusin", handleFocus);
      }

      let progress = 0;
      const systemTheme = window.matchMedia("(prefers-color-scheme: dark)")
        .matches
        ? "dark"
        : "light";
      let preferredTheme;
      try {
        preferredTheme =
          localStorage.getItem("themeMode") ||
          localStorage.getItem("preferredTheme");
      } catch {
        // The system preference still applies if browser storage is blocked.
      }
      const theme =
        preferredTheme === "light" || preferredTheme === "dark"
          ? preferredTheme
          : systemTheme;
      document.documentElement.dataset.splashTheme = theme;
      if (theme === "dark") {
        document.getElementById("app-logo").src =
          "%PUBLIC_URL%/vector/logo-dark.svg";
        document.getElementById("splash-endorsement-logo").src =
          "%PUBLIC_URL%/vector/komunick-rodape-dark.svg";
      }

      window.renderError = message => {
        // During restart transition, suppress error rendering — the
        // backend is expected to be down.
        if (window.__ticketzRestartTransition) return;

        const splashScreen = document.getElementById("splash-screen");
        if (!splashScreen) return;
        splashScreen.innerHTML = `
            <div style="text-align: center;">
            <svg class="alertsign" id="Layer_1" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 122.88 111.54"><defs><style>.cls-1{fill:#cf1f25;}.cls-2{fill:#fec901;fill-rule:evenodd;}.cls-3{fill:#010101;}</style></defs><title>warning</title><path class="cls-1" d="M2.35,84.42,45.28,10.2l.17-.27h0A23,23,0,0,1,52.5,2.69,17,17,0,0,1,61.57,0a16.7,16.7,0,0,1,9.11,2.69,22.79,22.79,0,0,1,7,7.26q.19.32.36.63l42.23,73.34.24.44h0a22.48,22.48,0,0,1,2.37,10.19,17.63,17.63,0,0,1-2.17,8.35,15.94,15.94,0,0,1-6.93,6.6c-.19.1-.39.18-.58.26a21.19,21.19,0,0,1-9.11,1.75v0H17.61c-.22,0-.44,0-.65,0a18.07,18.07,0,0,1-6.2-1.15A16.42,16.42,0,0,1,3,104.24a17.53,17.53,0,0,1-3-9.57,23,23,0,0,1,1.57-8.74,7.66,7.66,0,0,1,.77-1.51Z"/><path class="cls-2" d="M9,88.75,52.12,14.16c5.24-8.25,13.54-8.46,18.87,0l42.43,73.69c3.39,6.81,1.71,16-9.33,15.77H17.61C10.35,103.8,5.67,97.43,9,88.75Z"/><path class="cls-3" d="M57.57,83.78A5.53,5.53,0,0,1,61,82.2a5.6,5.6,0,0,1,2.4.36,5.7,5.7,0,0,1,2,1.3,5.56,5.56,0,0,1,1.54,5,6.23,6.23,0,0,1-.42,1.35,5.57,5.57,0,0,1-5.22,3.26,5.72,5.72,0,0,1-2.27-.53A5.51,5.51,0,0,1,56.28,90a5.18,5.18,0,0,1-.36-1.27,5.83,5.83,0,0,1-.06-1.31h0a6.53,6.53,0,0,1,.57-2,4.7,4.7,0,0,1,1.14-1.56Zm8.15-10.24c-.19,4.79-8.31,4.8-8.49,0-.82-8.21-2.92-29.34-2.86-37.05.07-2.38,2-3.79,4.56-4.33a12.83,12.83,0,0,1,5,0c2.61.56,4.65,2,4.65,4.44v.24L65.72,73.54Z"/></svg>
            <p>${message}</p>
            </div>
        `;
      };

      window.mentionClick = mention => {
        console.log("mentionClick not implemented yet", mention);
      };

      window.mentionRenderer = mention => {
        return (
          `<span class="ticketzMention" onclick='window.mentionClick(${JSON.stringify(mention).replace(/'/g, "\\'")})'>@` +
          (mention?.name || mention?.number || "invalid mention") +
          "</span>"
        );
      };

      const configureSplash = async config => {
        // During restart transition, skip backend fetches — the
        // backend is expected to be down.
        if (window.__ticketzRestartTransition) return;

        const protocol = config.BACKEND_PROTOCOL || "https";
        const hostname = config.BACKEND_HOST || window.location.hostname;
        const port = config.BACKEND_PORT ? `:${config.BACKEND_PORT}` : "";
        const path =
          config.BACKEND_PATH ||
          (hostname === "localhost" || hostname !== window.location.hostname
            ? ""
            : "/backend");

        const backendUrl = `${protocol}://${hostname}${port}${path}`;
        const settingsBaseUrl = backendUrl + "/public-settings";

        fetch(
          settingsBaseUrl +
            "/primaryColor" +
            (theme === "dark" ? "Dark" : "Light")
        )
          .then(response => response.json())
          .then(data => {
            const root = document.documentElement;
            // Zap Komunick: brand defaults
            const color = data || (theme === "dark" ? "#35B62E" : "#1F7F1B");

            root.style.setProperty("--primary", color);
            // Persist the resolved primary color so the restart
            // transition can render it while the backend is down.
            localStorage.setItem("ticketzPrimaryColor", color);
          });

        // Persist the login background image so the restart transition
        // can render it while the backend is down.
        fetch(settingsBaseUrl + "/loginBackgroundContent")
          .then(response => response.json())
          .then(data => {
            if (data) {
              localStorage.setItem(
                "ticketzBackgroundImage",
                backendUrl + "/public/" + data
              );
            }
          });

        Promise.all([
          fetch(settingsBaseUrl + "/appLogoDark"),
          fetch(settingsBaseUrl + "/appLogoLight")
        ])
          .then(async responses => {
            const logoSrc =
              (await (theme === "dark" ? responses[0] : responses[1]).json()) ||
              (await (theme === "dark" ? responses[1] : responses[0]).json());

            const appLogo = document.getElementById("app-logo");
            if (appLogo && logoSrc) {
              appLogo.src = backendUrl + "/public/" + logoSrc;
              document.getElementById("splash-endorsement").hidden = true;
            }
          })
          .catch(() => undefined);

        fetch(settingsBaseUrl + "/appName")
          .then(response => response.json())
          .then(data => {
            const name = typeof data === "string" ? data.trim() : "";
            const legacy =
              /^(ticketz|ticketz - chat based ticket system|whitelabel\s*chat)$/i;
            document.title =
              !name || legacy.test(name.replace(/\s+/g, " "))
                ? "SuperChat"
                : name.replace(/\bZap[\s-]+Komunick\b/gi, "SuperChat");
            const appLogo = document.getElementById("app-logo");
            if (appLogo) {
              appLogo.alt = document.title;
              if (document.title !== "SuperChat") {
                document.getElementById("splash-endorsement").hidden = true;
              }
            }
          })
          // Keep the initial title, or a configured name already resolved by React.
          .catch(() => undefined);
      };

      fetch("/config.json").then(async response => {
        response.json().then(config => {
          configureSplash(config);
        });
      });

      const interval = setInterval(() => {
        const progressBar = document.getElementById("progress-bar");
        if (!progressBar) return;

        if (progress < 50) {
          progress += 10;
        } else if (progress < 80) {
          progress += 3;
        } else if (progress < 99) {
          progress += (99 - progress) / 20;
        }
        progressBar.style.width = progress + "%";
      }, 1000);

      window.finishProgress = () => {
        if (window.__ticketzRestartTransition) return;
        const splash = document.getElementById("splash-background");
        const progressBar = document.getElementById("progress-bar");
        if (!splash) return;
        clearInterval(interval);
        if (progressBar) {
          progressBar.style.width = "100%";
          setTimeout(() => splash.remove(), 200);
        } else {
          splash.remove();
        }
      };

      // Restart transitional page: show countdown before redirecting.
      (function handleRestartTransition() {
        const params = new URLSearchParams(window.location.search);
        if (params.get("restart") !== "1") return;

        // Signal to other parts of the page that the backend is restarting
        // so they suppress error rendering and skip backend fetches.
        window.__ticketzRestartTransition = true;

        // Stop the normal splash progress
        clearInterval(interval);

        // Apply the persisted primary color and background image so the
        // restart transition matches the configured branding while the
        // backend is down.
        const root = document.documentElement;
        const storedPrimaryColor = localStorage.getItem("ticketzPrimaryColor");
        if (storedPrimaryColor) {
          root.style.setProperty("--primary", storedPrimaryColor);
        }
        const storedBackgroundImage = localStorage.getItem(
          "ticketzBackgroundImage"
        );
        if (storedBackgroundImage) {
          const splashBackground = document.getElementById("splash-background");
          splashBackground.style.backgroundImage = `url("${storedBackgroundImage}")`;
          splashBackground.style.backgroundSize = "cover";
          splashBackground.style.backgroundPosition = "center";
        }

        const splashScreen = document.getElementById("splash-screen");
        const countdownSeconds = 60;

        splashScreen.innerHTML = `
          <div style="text-align: center; width: 100%;">
            <svg class="alertsign" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"></polyline>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
            <div class="progress-bar">
              <div class="progress regress" id="restart-progress-bar" style="animation-duration: ${countdownSeconds}s;"></div>
            </div>
          </div>
        `;

        const redirect = () => {
          // Remove the restart param and navigate to /settings
          const url = new URL(window.location.href);
          url.searchParams.delete("restart");
          url.pathname = "/settings";
          window.location.href = url.toString();
        };

        // Redirect after the regress animation completes
        setTimeout(redirect, countdownSeconds * 1000);
      })();
    </script>
  </body>
</html>
