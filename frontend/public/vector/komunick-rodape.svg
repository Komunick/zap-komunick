<svg xmlns="http://www.w3.org/2000/svg" width="173" height="48" viewBox="0 0 173 48" role="img" aria-label="Komunick Inteligência e Tecnologia">
  <title>Komunick Inteligência e Tecnologia</title>
  <defs>
    <image id="oficial" width="173" height="48" href="data:image/png;base64,"/>
    <clipPath id="wordmark"><rect width="173" height="32" /></clipPath>
    <clipPath id="tagline"><rect y="32" width="173" height="16" /></clipPath>
    <filter id="transparent-green" x="0" y="0" width="173" height="48" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="
        0 0      0 0  0.2471
        0 0      0 0  0.6824
        0 0      0 0  0.2078
        0 1.5741 0 0 -0.0741" />
    </filter>
    <filter id="transparent-tagline" x="0" y="0" width="173" height="48" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="
        0 0      0 0  0.2353
        0 0      0 0  0.3137
        0 0      0 0  0.2706
        0 1.1972 0 0 -0.0563" />
    </filter>
  </defs>
  <g clip-path="url(#wordmark)"><use href="#oficial" filter="url(#transparent-green)" /></g>
  <g clip-path="url(#tagline)"><use href="#oficial" filter="url(#transparent-tagline)" /></g>
</svg>
