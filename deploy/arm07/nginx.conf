worker_processes auto;
error_log stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    # No cookies, bearer tokens, query strings or request bodies in access logs.
    access_log off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream zap_backend { server backend:3000; }

    server {
        listen 8080;
        server_name superchat.komunick.com;
        root /var/www/public;
        index index.html;
        client_max_body_size 65m;

        # The host Caddy reaches only the loopback-published Docker edge.
        # Do not trust all private networks or a client-provided forwarding chain.
        set_real_ip_from 172.29.251.1;
        set_real_ip_from 127.0.0.1;
        real_ip_header X-Forwarded-For;
        real_ip_recursive off;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        location = /config.json {
            add_header Cache-Control "no-store" always;
        }
        location = /deployment.json {
            add_header Cache-Control "no-store" always;
        }
        location = /index.html {
            add_header Cache-Control "no-store" always;
        }
        location = /manifest.json {
            proxy_pass http://zap_backend/manifest.json;
        }
        location = /backend { return 308 /backend/; }
        location /backend/ { proxy_pass http://zap_backend/; }
        location /socket.io/ { proxy_pass http://zap_backend; }
        location /static/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache" always;
        }
        location ~ /\. { deny all; }
    }
}
